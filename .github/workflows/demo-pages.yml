#  ISO/IEC 27001:2022 A.8.28 Secure, accessible static profile demo — ALIGNED architecture and reference.
#  Alignment references the official ISO/IEC standards published through iso.org. Alignment of this work is self-declared by JelvanR.
#  Referenced standards © ISO/IEC; licensed reference copies held by JelvanR remain restricted under their issued terms. No standard text is reproduced here.
#  Guideline rules: AGENT-003, REPO-026, REPO-009
name: Verify and publish the read-only demo

on:
  pull_request:
    paths:
      - "demo/**"
      - "scripts/build-demo.cjs"
      - "tests/**"
      - "package*.json"
      - ".github/workflows/demo-pages.yml"
  push:
    branches: [main]
    paths:
      - "demo/**"
      - "scripts/build-demo.cjs"
      - "tests/**"
      - "package*.json"
      - ".github/workflows/demo-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demo-pages-${{ github.event_name == 'pull_request' && github.ref || 'release' }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run build:demo
      - name: Upload only the read-only Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: .site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure an already-enabled Pages site
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy the read-only demo
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
